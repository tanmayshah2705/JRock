<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<script>
// JRock part starts here
function $$$(cid){
let element=document.getElementById(cid);
if(!element) throw "Invalid id : "+cid;
return new JRockElement(element);
}

function JRockElement(element)
{
this.element=element;
this.html=function(content)
{
if(typeof this.element.innerHTML=="string")
{
if(typeof content=="string")
{
this.element.innerHTML=content;
}
return this.element.innerHTML;
}
return null;
} // html function ends

this.value=function(content)
{
if(typeof this.element.value)
{
if(typeof content=="string")
{
this.element.value=content;
}
return this.element.value;
}
return null;
} // value function ends

} // class JRockElement ends

$$$.ajax=function(jsonObject)
{
if(!jsonObject["url"]) throw "url is missing in call to ajax";
let url = jsonObject["url"];
if((typeof url)!="string") throw "url property should be of string type";
let methodType="GET";
if(jsonObject["methodType"])
{
methodType=jsonObject["methodType"];
if((typeof methodType)!="string") throw "methodType property should be of string type in call to ajax";
methodType=methodType.toUpperCase();
if(["GET","POST"].includes(methodType)==false) throw "methodType should be GET/POST in call to ajax"; 
}
let onSuccess=null;
if(jsonObject["success"])
{
onSuccess=jsonObject["success"];
if((typeof onSuccess)!="function") throw "success property should be a function in call to ajax";
}
let onFailure=null;
if(jsonObject["failure"])
{
onFailure=jsonObject["failure"];
if((typeof onFailure)!="function") throw "failure property should be a function in call to ajax";
}

if(methodType=="GET")
{
var xmlHttpRequest = new XMLHttpRequest();
xmlHttpRequest.onreadystatechange=function(){
if(this.readyState==4)
{
if(this.status==200)
{
var responseData = this.responseText;
if(onSuccess) onSuccess(responseData);
}
else
{
if(onFailure) onFailure();
}
}
};
if(jsonObject["data"])
{
let jsonData = jsonObject["data"];
let querystr="";
let qsName;
let qsValue;
let i=0;
for(key in jsonData)
{
if(i==0) querystr="?";
if(i>0) querystr+="&";
i++;
qsName=encodeURI(key);
qsValue=encodeURI(jsonData[key]);
querystr=querystr+qsName+"="+qsValue;
}
url+=querystr; 
}

xmlHttpRequest.open(methodType,url,true);
xmlHttpRequest.send();
}

if(methodType=="POST")
{
var xmlHttpRequest = new XMLHttpRequest();
xmlHttpRequest.onreadystatechange=function(){
if(this.readyState==4)
{
if(this.status==200)
{
var responseData = this.responseText;
if(onSuccess) onSuccess(responseData);
}
else
{
if(onFailure) onFailure();
}
}
};

let jsonData={};
if(jsonObject["data"])
{
jsonData = jsonObject["data"]; 
}
xmlHttpRequest.open(methodType,url,true);
xmlHttpRequest.setRequestHeader("Content-type","application/json");
xmlHttpRequest.send(JSON.stringify(jsonData));

}
}
// JRock part ends here




function submitForm()
{
var firstName=$$$("firstName").value();
var lastName=$$$("lastName").value();
var age=$$$("age").value();
var customer=
{
"firstName":firstName,
"lastName":lastName,
"age":age
};
var whatever=$$$("whatever");
whatever.html("");
$$$.ajax({
"url":"servletThree",
"data":customer,
"methodType":"POST",
"success":function(responseData){
var customer=JSON.parse(responseData);
whatever.html(customer.firstName +"\n"+ customer.lastName +"\n"+ customer.age);
},
"failure":function(){
alert("Some problem");
}
});
}
</script>
</head>
<body>
<h1>POST type request with form </h1>
First Name <input type='text' id='firstName'><br>
Last Name <input type='text' id='lastName'><br>
Age <input type='text' id='age'><br>
<button type='button' onclick=submitForm()>Save</button>
<br>
<div id='whatever'></div>
</body>
</html>
