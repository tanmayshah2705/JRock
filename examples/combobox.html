<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>JRock Combo Box Example</title>
    <script src="jrock.js"></script>

<script>

$$$.onDocumentLoaded(function()
{
    var students=[
        {
            id:101,
            name:"Apple"
        },
        {
            id:102,
            name:"Mango"
        },
        {
            id:103,
            name:"Orange"
        },
        {
            id:104,
            name:"Guava"
        }
    ];

    $$$("studentCombo").fillComboBox({
        dataSource:students,
        text:"name",
        value:"id",
        firstOption:{
            text:"Select a fruit",
            value:"-1"
        }
    });
});

</script>

</head>

<body>

<h2>JRock Combo Box example</h2>

<select id="studentCombo"></select>

</body>
</html>
