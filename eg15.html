}

		if(keyObjectElement.type=="radio")

}

if(keyObjectElement.type=="url")
{

        if(firstInvalidComponent==null) firstInvalidComponent=keyObjectElement;

        if(firstInvalidComponent==null) firstInvalidComponent=keyObjectElement;

}

if(keyObjectElement.type=="date" || keyObjectElement.type=="datetime-local" || keyObjectElement.type=="month" || inputType=="time" || keyObjectElement.type=="week")
{

}

}

if(keyObjectElement.type=="file")

        if(firstInvalidComponent==null) firstInvalidComponent=keyObjectElement;
    }
}

if(keyObjectElement.type=="hidden")
{

}

//JRock user script starts here
function doSomething() 
{
return $$$("someForm").isValid({
"nm":{
"required":true,
"max-length":20,
"error-pane":"nmErrorSection",
"errors":{
"required":"Name required",
"max-length":"Name cannot exceed 20 characters"
}
},
"ad":{
"required":true,
"error-pane":"adErrorSection",
"errors":{
"required":"Address required"
}
},
"ct":{
"invalid":-1,
"error-pane":"ctErrorSection",
"errors":{
"invalid":"Select city"
}
},
"gender":{
"required":true,
"error-pane":"genderErrorSection",
"errors":{
"required":"Select gender"
}
},
"agree":{
"required-state":true,
"display-alert":true,
"errors":{
"required-state":"Select I Agree checkbox"
}
}
});
}
