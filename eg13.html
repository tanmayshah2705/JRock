<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>JRock grid</title>
<style>

.jrock_jgrid_header_division
{
overflow-x:hidden;
overflow-y:hidden;
}
.jrock_jgrid_body_division
{
overflow-x:auto;
overflow-y:auto;
height:400px;
}

.jrock_jgrid_head
{
border:1px groove green;
border-bottom:0px;
border-spacing:0px;
border-collapse:collapse;
background:lightgray;
}
.jrock_jgrid_head td
{
border-left:1px groove red;
border-right:1px groove red;
border-top:1px groove red;
border-bottom:0px;
width:50px;
text-align:right;
}
.jrock_jgrid_head td+td
{
width:100px;
text-align:left;
}
.jrock_jgrid_head td+td+td
{
width:200px;
text-align:left;
}
.jrock_jgrid_head td+td+td+td
{
width:200px;
text-align:left;
}
.jrock_jgrid_head td+td+td+td+td
{
width:200px;
text-align:left;
}
.jrock_jgrid_body
{
border:1px groove green;
border-spacing:0px;
border-collapse:collapse;
}
.jrock_jgrid_body td
{
border:1px groove red;
width:50px;
text-align:right;
}
.jrock_jgrid_body td+td
{
width:100px;
text-align:left;
}
.jrock_jgrid_body td+td+td
{
width:200px;
text-align:left;
}
.jrock_jgrid_body td+td+td+td
{
width:200px;
text-align:left;
}
.jrock_jgrid_body td+td+td+td+td
{
width:200px;
text-align:left;
}
.jrock_jgrid_pagination td
{
width:100px;
text-align:center;
}
</style>

<!-- user specific styling-->
<style>
.someStyle
{
width:900px;
height:600px;
border:1px solid red;
overflow:auto;
}
</style>

<script>
class Student
{
constructor(rollNumber,name,nameOfMother,nameOfFather)
{
this.rollNumber=rollNumber;
this.name=name;
this.nameOfMother=nameOfMother;
this.nameOfFather=nameOfFather;
}
}

class Grid
{
constructor(dataTableId,dataTablePaginationId,students,pageSize)
{
this.dataTableId=dataTableId;
this.dataTablePaginationId=dataTablePaginationId;
this.students=students;
this.pageSize=pageSize;
this.pageNumber=10;
this.numberOfPaginationControls=5;
this.update();
this.updatePagination();
}
update()
{
var dataTable=document.getElementById(this.dataTableId);
var tr;
var td;
var startFromIndex=(this.pageNumber-1)*this.pageSize;
var endAtIndex=startFromIndex+this.pageSize-1;
var x;
for(x=startFromIndex;x<=endAtIndex;x++)
{
tr=document.createElement("tr");
td=document.createElement("td");
td.innerHTML=(x+1);
tr.appendChild(td);
td=document.createElement("td");
td.innerHTML=this.students[x].rollNumber;
tr.appendChild(td);
td=document.createElement("td");
td.innerHTML=this.students[x].name;
tr.appendChild(td);
td=document.createElement("td");
td.innerHTML=this.students[x].nameOfMother;
tr.appendChild(td);
td=document.createElement("td");
td.innerHTML=this.students[x].nameOfFather;
tr.appendChild(td);
dataTable.appendChild(tr);
}
}
updatePagination()
{
var startFrom=((Math.floor((this.pageNumber-1)/this.numberOfPaginationControls)+1)-1)*this.numberOfPaginationControls+1;
var endAt=startFrom+this.numberOfPaginationControls-1;
var numberOfPages=Math.floor(this.students.length/this.pageSize);
if(this.students.length%this.pageSize!=0) numberOfPages++;
if(endAt>numberOfPages) endAt=numberOfPages;
var dataTablePagination=document.getElementById(this.dataTablePaginationId);
var x;
var tr;
var td;
var anchor;
tr=document.createElement("tr");
if(startFrom>1)
{
td=document.createElement("td");
anchor=document.createElement("a");
anchor.text="prev";
anchor.href='abcd';
td.appendChild(anchor);
tr.appendChild(td);
}
for(x=startFrom;x<=endAt;x++)
{
td=document.createElement("td");
if(x==this.pageNumber)
{
td.innerHTML="<b>"+x+"</b>";
}
else
{
anchor=document.createElement("a");
anchor.text=x;
anchor.href='abcd';
td.appendChild(anchor);
}
tr.appendChild(td);
}
if(endAt<numberOfPages)
{
td=document.createElement("td");
anchor=document.createElement("a");
anchor.text="next";
anchor.href="abcd";
td.appendChild(anchor);
tr.appendChild(td);
}
dataTablePagination.appendChild(tr);
}
}

var model={
"grid":null
};

function loader()
{
var i;
var students=new Array();
for(i=101;i<=1000;i++)
{
students.push(new Student(i,i+" Name",i+" Mother",i+" Father"));
}
model.grid=new Grid('dataTable','dataTablePagination',students,35);
}
window.addEventListener('load',loader);
</script>
</head>
<body>
<div class='someStyle'>

<div class="jrock_jgrid_header_division">
<table class="jrock_jgrid_head">
<tr>
<td>S. No.</td>
<td>Roll No.</td>
<td>Name</td>
<td>Mother</td>
<td>Father</td>
</tr>
</table>
</div>
<div class="jrock_jgrid_body_division">
<table class="jrock_jgrid_body" id="dataTable">
</table>
</div>
<div class ="jrock_jgrid_pagination_division">
<table class='jrock_jgrid_pagination' id='dataTablePagination'>
</table>
</div>

</div>
</body>
</html>
