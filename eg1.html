<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<title>AJAX Example</title>
<script>
// JSLib part starts here
function $$$(cid){

}
$$$.ajax=function(jsonObject)
{
if(!jsonObject["url"]) throw "url is missing in call to ajax";
let url = jsonObject["url"];
if((typeof url)!="string") throw "url property should be of string type";
let methodType="GET";
if(jsonObject["methodType"])
{
methodType=jsonObject["methodType"];
if((typeof methodType)!="string") throw "methodType property should be of string type in call to ajax";
methodType=methodType.toUpperCase();
if(["GET","POST"].includes(methodType)==false) throw "methodType should be GET/POST in call to ajax"; 
}
let onSuccess=null;
if(jsonObject["success"])
{
onSuccess=jsonObject["success"];
if((typeof onSuccess)!="function") throw "success property should be a function in call to ajax";
}
let onFailure=null;
if(jsonObject["failure"])
{
onFailure=jsonObject["failure"];
if((typeof onFailure)!="function") throw "failure property should be a function in call to ajax";
}

if(methodType=="GET")
{
var xmlHttpRequest = new XMLHttpRequest();
xmlHttpRequest.onreadystatechange=function(){
if(this.readyState==4)
{
if(this.status==200)
{
var responseData = this.responseText;
if(onSuccess) onSuccess(responseData);
}
else
{
if(onFailure) onFailure();
}
}
};
xmlHttpRequest.open(methodType,url,true);
xmlHttpRequest.send();
}
if(methodType=="POST")
{
}

}
// JSLib part ends here

function populateDesignations()
{
$$$.ajax({
"url":"servletOne",
"methodType":"GET",
"success":function(responseData){
var designations=JSON.parse(responseData);
var designationsComboBox=document.getElementById("whatever");
var obj;
for(var i=0;i<designations.length;i+=2)
{
obj=document.createElement("option");
obj.value=designations[i].code;
obj.text=designations[i].title;
designationsComboBox.appendChild(obj);
}
},
"failure":function(){
alert("Some problem");
}
});
}
window.addEventListener('load',populateDesignations);
</script>
</head>
<body>
Select designation :
<select id='whatever'>
</select>
</body>
</html>
